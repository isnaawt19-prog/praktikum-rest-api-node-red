
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    color: white;
    text-align: center;
    margin-bottom: 25px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.card, .panel {
    background: white;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.label {
    color: #888;
    font-size: 14px;
}

.value {
    font-size: 40px;
    font-weight: bold;
    color: #667eea;
    margin: 10px 0;
}

.unit {
    color: #aaa;
}

.panel {
    margin-bottom: 25px;
    text-align: left;
}

.panel h2 {
    margin-bottom: 15px;
    font-size: 18px;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin: 5px;
}

.btn-on {
    background: #28a745;
}

.btn-off {
    background: #dc3545;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f8f9fa;
}

#log {
    background: #1e1e1e;
    color: #0f0;
    padding: 15px;
    border-radius: 10px;
    min-height: 80px;
    max-height: 180px;
    overflow-y: auto;
}

.status {
    font-weight: bold;
    font-size: 20px;
}

.online {
    color: green;
}

.offline {
    color: red;
}
</style>
</head>

<body>

<div class="container">

<h1>IoT Dashboard - REST API</h1>

<div class="cards">

    <div class="card">
        <div class="label">SUHU</div>
        <div class="value" id="suhu">--</div>
        <div class="unit">°C</div>
    </div>

    <div class="card">
        <div class="label">KELEMBABAN</div>
        <div class="value" id="kelembaban">--</div>
        <div class="unit">%</div>
    </div>

    <div class="card">
        <div class="label">STATUS SENSOR</div>
        <div class="value status offline" id="status">
            OFFLINE
        </div>
    </div>

</div>

<div class="panel">

    <h2>Kontrol Perangkat</h2>

    <button class="btn-on" onclick="kontrol('lamp','on')">
        Nyalakan Lampu
    </button>

    <button class="btn-off" onclick="kontrol('lamp','off')">
        Matikan Lampu
    </button>

</div>

<div class="panel">

    <h2>10 Data Sensor Terakhir</h2>

    <table>
        <thead>
            <tr>
                <th>Waktu</th>
                <th>Suhu (°C)</th>
                <th>Kelembaban (%)</th>
            </tr>
        </thead>

        <tbody id="history-body">
            <tr>
                <td colspan="3">Loading...</td>
            </tr>
        </tbody>
    </table>

</div>

<div class="panel">

    <h2>Log Aktivitas</h2>

    <div id="log"></div>

</div>

</div>

<script>

// Alamat REST API
const API_BASE = '/api';

// Log aktivitas
function log(pesan) {
    const el = document.getElementById('log');

    el.innerHTML += '<div>[' +
        new Date().toLocaleTimeString() +
        '] ' + pesan + '</div>';

    el.scrollTop = el.scrollHeight;
}

// Mengambil data suhu
async function fetchSensor() {
    try {
        const res = await fetch(API_BASE + '/suhu');
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const json = await res.json();

        if (json.status === 'success' &&
            json.data.suhu !== null) {

            document.getElementById('suhu').textContent =
                json.data.suhu;

            document.getElementById('kelembaban').textContent =
                json.data.kelembaban;

            document.getElementById('status').textContent =
                'ONLINE';

            document.getElementById('status').className =
                'value status online';

        } else {
            throw new Error('Data sensor belum tersedia');
        }

    } catch (err) {
        document.getElementById('status').textContent =
            'OFFLINE';

        document.getElementById('status').className =
            'value status offline';

        log('Gagal fetch sensor: ' + err.message);
    }
}

// Mengambil riwayat sensor
async function fetchHistory() {
    try {
        const res = await fetch(API_BASE + '/history');
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const json = await res.json();

        const tbody =
            document.getElementById('history-body');

        if (!json.data || json.data.length === 0) {
            tbody.innerHTML =
                '<tr><td colspan="3">Belum ada data</td></tr>';
            return;
        }

        const rows = json.data.slice(-10).reverse()
            .map(d => `
                <tr>
                    <td>${new Date(d.received).toLocaleTimeString()}</td>
                    <td>${d.suhu}</td>
                    <td>${d.kelembaban}</td>
                </tr>
            `).join('');

        tbody.innerHTML = rows;

    } catch (err) {
        log('Gagal fetch history: ' + err.message);
    }
}

// Kontrol lampu
async function kontrol(device, action) {
    try {
        const res = await fetch(API_BASE + '/kontrol', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                device: device,
                action: action
            })
        });

        const json = await res.json();

        if (json.status === 'success') {
            log('Perintah terkirim: ' +
                device + ' -> ' + action);
        } else {
            log('Gagal: ' + json.message);
        }

    } catch (err) {
        log('Error kontrol: ' + err.message);
    }
}

// Menjalankan dashboard
log('Dashboard dimulai');

fetchSensor();
fetchHistory();

setInterval(fetchSensor, 3000);
setInterval(fetchHistory, 5000);

</script>

</body>
</html>
